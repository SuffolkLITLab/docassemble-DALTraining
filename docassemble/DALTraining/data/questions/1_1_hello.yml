---
# Some basic building blocks. Think about what you expect to happen when you press "Run" below
#
# Takeaways:
# - Keywords: `---`, `question`, `mandatory`
# - A block that uses `question` can show a page
# - Force a page to display with `mandatory: True`
# - A `---` creats a block
---
mandatory: True
question: |
  Hello!
---
# Lesson 1b
# Use ids
mandatory: True
id: the only page
question: |
  Hello!
---
# Internal notes
# ids:
# - people always leave them out, so start early
# - make it easier to find the block
# - make it easier to tell if you have a duplicate block (that's a super advanced lession)
# - help testing work better
# - help clear cache for refreshing values when you edit an interview and an previous user comes back with an older version of the interview
---

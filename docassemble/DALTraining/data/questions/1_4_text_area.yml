# 4: Text area
---
mandatory: True
id: interview order
code: |
  preferred_name
  legal_name
  incident_description
  end
---
event: end
id: the end
question: |
  Your statement
subquestion: |
  You, ${ preferred_name } (with the legal name of ${ legal_name }) described the following:

  **Incident description:**
  
  ${ incident_description }
---
# Notice we combined the two pages into one page with multiple fields
id: user's legal name
question: |
  What is your full legal name?
fields:
  - Your full name on official paperwork: legal_name
    input type: text
  - Your preferred name, if you have one: preferred_name
    input type: text
---
# Text area docs: https://docassemble.org/docs/fields.html#plaintext:~:text=input%20type%3A%20area,-provides
id: description
question: |
  The incident
fields:
  - Describe what happened: incident_description
    input type: area
---
# References:
# Text field docs: https://docassemble.org/docs/fields.html#plaintext:~:text=datatype%3A%20text
# Text area docs: https://docassemble.org/docs/fields.html#plaintext:~:text=input%20type%3A%20area,-provides
